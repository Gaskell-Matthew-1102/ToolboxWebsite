<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeVue Button with Jinja</title>

  <!-- Include PrimeVue CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primevue/resources/themes/saga-blue/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primevue/resources/primevue.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons/primeicons.css">

  <!-- Include Vue.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.js"></script>
  <!-- Include PrimeVue JS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/primevue@3.14.0/dist/primevue.min.js"></script>
</head>
<body>
  <div id="app">
    {% if session %}
      <h1>Welcome {{ session.userinfo.name }}!</h1>
      <!-- Button for Logout -->
      <Button as="a" label="Logout" icon="pi pi-sign-out" href="/logout"></Button>
    {% else %}
      <h1>Welcome Guest</h1>
      <!-- Button for Login -->
      <Button as="a" label="Login" icon="pi pi-user" href="/login"></Button>
    {% endif %}
  </div>

  <script>
    const app = Vue.createApp({});
    app.use(PrimeVue);
    app.mount('#app');
  </script>
</body>
</html>
